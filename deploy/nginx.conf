# /etc/nginx/sites-available/kvarta  (replace kvarta.example with the real domain)
# Obtain the certificate first (docs/deploy-server.md, "nginx and TLS"): the 443 block below cannot load
# until the certificate files exist. The limit_req_zone line belongs in the http {} context; a file in
# /etc/nginx/conf.d/ or this file included from http {} (sites-enabled) both work.

limit_req_zone $binary_remote_addr zone=kvarta_lead:10m rate=30r/m;

server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name kvarta.example;

    # ACME HTTP-01 challenge (certbot --webroot / renewals) is served before the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "ssl http2" works on every nginx version. nginx >= 1.25.1 prints a deprecation warning for it and
    # prefers a separate "http2 on;" line; both are fine.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kvarta.example;

    ssl_certificate     /etc/letsencrypt/live/kvarta.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kvarta.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers. No Content-Security-Policy on purpose: MUI/Emotion inject inline <style> tags and
    # Next.js inlines bootstrap scripts, so a CSP without per-request nonces would either break the page or
    # need 'unsafe-inline', which gives no protection. Add one only together with nonce support in the app.
    # NOTE: add_header in a location REPLACES the inherited ones, so locations that add their own repeat these.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Defaults for every proxied location.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # OVERWRITE, never append ($proxy_add_x_forwarded_for): the app rate-limits on the FIRST entry of
    # X-Forwarded-For, so a value sent by the client must never reach it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/lead {
        client_max_body_size 20k;
        limit_req zone=kvarta_lead burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    # Fingerprinted build assets never change.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        client_max_body_size 20k;
        proxy_pass http://127.0.0.1:3000;
    }
}
